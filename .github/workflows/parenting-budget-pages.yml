name: Deploy ParentingBudget to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ParentingBudget/**'
      - '.github/workflows/parenting-budget-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ParentingBudget
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ParentingBudget/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm run build:pages
      - name: Prepare Pages artifact
        run: |
          mkdir -p pages-root/ParentingBudget
          cp -R pages-dist/. pages-root/ParentingBudget/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ParentingBudget/pages-root
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
